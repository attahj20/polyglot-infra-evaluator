name: Polyglot Infrastructure Validation CI\n\non:\n  push:\n    branches: [ main ]\n  pull_request:\n    branches: [ main ]\n\njobs:\n  evaluate:\n    runs-on: ubuntu-latest\n\n    steps:\n    - name: Checkout Repository Codebase\n      uses: actions/checkout@v4\n\n    - name: Configure Python Virtual Runtime Environment\n      uses: actions/setup-python@v5\n      with:\n        python-version: "3.11"\n\n    - name: Configure Node.js Networking Runtime\n      uses: actions/setup-node@v4\n      with:\n        node-version: "18"\n\n    - name: Run Complete Master Grading Harness Suite\n      env:\n        PYTHONUTF8: 1\n      run: python evaluation_harness/run_all_tests.py\n